name: android-ci

on:
  push:
    branches: [ "master", "main", "dev/**" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 与本机一致：构建 JDK 21（见 gradle.properties 的 org.gradle.java.home 说明）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # CI 上没有本机固定路径的 JDK，清掉 org.gradle.java.home 让 Gradle 用 JAVA_HOME
      - name: Drop local JDK pin for CI
        run: sed -i '/org.gradle.java.home/d' gradle.properties

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
